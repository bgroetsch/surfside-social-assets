name: Render brochure card

# Renders a REMAX Surfside brochure card (1080x1350 JPG) from a JSON spec in an
# issue, commits it, and replies with the permanent GitHub Pages URL. Used by the
# weekly listing and vacation-rental Buffer tasks, which have no browser.
#
# Open an issue titled "[render] ..." whose body is the JSON spec (optionally in a
# ```json fence). The spec format is in render/SPEC.md. Reply is ASSET_READY + URL,
# or ASSET_FAILED + the reason.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: asset-commits
  cancel-in-progress: false

jobs:
  render:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[render]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Render card
        id: render
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          set -o pipefail
          python render/render.py --issue-body-env BODY --out-root . | tee render.log

      - name: Commit
        env:
          DEST: ${{ steps.render.outputs.dest }}
          NUM: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "Identical file already present, nothing to commit."
          else
            git commit -m "Render $DEST (issue #$NUM)"
            for i in 1 2 3 4 5; do
              git pull --rebase --quiet && git push && break
              sleep $((i * 5))
            done
          fi

      - name: Reply with permanent URL
        env:
          GH_TOKEN: ${{ github.token }}
          DEST: ${{ steps.render.outputs.dest }}
          NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"
          name="${REPO##*/}"
          gh issue comment "$NUM" --body "$(printf 'ASSET_READY\nhttps://%s.github.io/%s/%s' "$owner" "$name" "$DEST")"
          gh issue close "$NUM"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          reason=$(grep -h '^ERROR:' render.log 2>/dev/null | head -n1 | sed 's/^ERROR: //')
          gh issue comment "$NUM" --body "$(printf 'ASSET_FAILED\n%s' "${reason:-See the workflow run log for details.}")"
